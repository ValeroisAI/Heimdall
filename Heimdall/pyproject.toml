[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heimdall-lm"
version = "1.0.0"
description = "Heimdall and Bifrost: hybrid Gated DeltaNet language models, constant-memory conversion of pretrained Transformers, training and OpenAI-compatible serving (ROCm / CUDA)"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Valerois AI"}]
readme = "README.md"
dependencies = ["torch>=2.4", "numpy", "tokenizers>=0.15"]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "safetensors>=0.4", "pydantic>=2"]
fast = ["flash-linear-attention>=0.2"]
dev = ["pytest", "httpx"]

[project.scripts]
heimdall-train = "heimdall.train:main"
heimdall-serve = "heimdall.server:main"
heimdall-export = "heimdall.export:main"

[tool.setuptools.packages.find]
include = ["heimdall*"]
