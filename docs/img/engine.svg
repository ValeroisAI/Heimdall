<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 298" width="880" height="298" role="img" aria-label="Training engine loop: disk hidden states, layer weights, teacher once, train new parameters, write next hidden states"><style>
  .bg{fill:#ffffff}.fg{fill:#172033}.mu{fill:#5b6577}.ln{stroke:#d5dae3}.st{stroke:#172033}
  .dn{fill:#c9ced8}.win{fill:#c47a12}.mem{fill:#0f8a80}.keep{fill:#6b4bd6}.sink{fill:#b4384f}.orig{fill:#8a93a3}
  .twin{fill:#fbefdc}.tmem{fill:#dcf3f0}.tkeep{fill:#ebe5fb}.box{fill:#f6f7f9}
  .swin{stroke:#c47a12}.smem{stroke:#0f8a80}.skeep{stroke:#6b4bd6}
  text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){
    .bg{fill:#0d1117}.fg{fill:#e6e9ef}.mu{fill:#9aa4b5}.ln{stroke:#2c3442}.st{stroke:#e6e9ef}
    .dn{fill:#3a414d}.win{fill:#e6a03c}.mem{fill:#3cc4b7}.keep{fill:#a08bff}.sink{fill:#ef6f86}.orig{fill:#6b7484}
    .twin{fill:#3a2b14}.tmem{fill:#12332f}.tkeep{fill:#2a2346}.box{fill:#161b22}
    .swin{stroke:#e6a03c}.smem{stroke:#3cc4b7}.skeep{stroke:#a08bff}
  }
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fg"/></marker></defs><rect width="880" height="298" rx="10" class="bg"/><text x="24" y="32" font-size="15" text-anchor="start" class="fg" font-weight="600">Training engine (heimdall/motor.py): one layer and one sequence on the GPU at a time</text><rect x="24" y="70" width="150" height="84" rx="8" class="box st" stroke-width="1.2"/><text x="99" y="102" font-size="13" text-anchor="middle" class="fg">Disk</text><text x="99" y="122" font-size="11" text-anchor="middle" class="mu">hidden states h_i</text><text x="99" y="138" font-size="11" text-anchor="middle" class="mu">32 seq × 32K tokens</text><rect x="214" y="70" width="150" height="84" rx="8" class="box st" stroke-width="1.2"/><text x="289" y="102" font-size="13" text-anchor="middle" class="fg">Layer i</text><text x="289" y="122" font-size="11" text-anchor="middle" class="mu">weights to the GPU</text><text x="289" y="138" font-size="11" text-anchor="middle" class="mu">~0.7 GB bf16</text><rect x="404" y="70" width="176" height="84" rx="8" class="tkeep skeep" stroke-width="1.4"/><text x="492" y="98" font-size="13" text-anchor="middle" class="keep" font-weight="600">Teacher, once</text><text x="492" y="118" font-size="11" text-anchor="middle" class="fg">full-attention output y_t,</text><text x="492" y="134" font-size="11" text-anchor="middle" class="fg">window output, fixed inputs</text><rect x="620" y="70" width="236" height="84" rx="8" class="tmem smem" stroke-width="1.4"/><text x="738" y="98" font-size="13" text-anchor="middle" class="mem" font-weight="600">300 training steps</text><text x="738" y="118" font-size="11" text-anchor="middle" class="fg">new parameters only, exact gradient</text><text x="738" y="134" font-size="11" text-anchor="middle" class="fg">through time segments</text><path d="M174,112 L210,112" fill="none" class="st" stroke-width="1.3" marker-end="url(#a)"/><path d="M364,112 L400,112" fill="none" class="st" stroke-width="1.3" marker-end="url(#a)"/><path d="M580,112 L616,112" fill="none" class="st" stroke-width="1.3" marker-end="url(#a)"/><path d="M738,154 L738,206 L99,206 L99,158" fill="none" class="st" stroke-width="1.3" marker-end="url(#a)"/><text x="418" y="226" font-size="12" text-anchor="middle" class="mu">forward pass with the trained layer → h_(i+1) written to disk → next layer</text><text x="24" y="262" font-size="12" text-anchor="start" class="mu">Loss on 12.5% random positions past the window, ×4 on question/answer spans of synthetic recall sequences.</text><text x="24" y="280" font-size="12" text-anchor="start" class="mu">Sequence length chosen from the estimated per-layer GPU peak (27B on 16 GB: 32K). DEVAM=1 resumes.</text></svg>