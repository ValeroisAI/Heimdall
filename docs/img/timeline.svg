<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 215" width="880" height="215" role="img" aria-label="Token timeline: sinks, compressed memory, exact window"><style>
  .bg{fill:#ffffff}.fg{fill:#172033}.mu{fill:#5b6577}.ln{stroke:#d5dae3}.st{stroke:#172033}
  .dn{fill:#c9ced8}.win{fill:#c47a12}.mem{fill:#0f8a80}.keep{fill:#6b4bd6}.sink{fill:#b4384f}.orig{fill:#8a93a3}
  .twin{fill:#fbefdc}.tmem{fill:#dcf3f0}.tkeep{fill:#ebe5fb}.box{fill:#f6f7f9}
  .swin{stroke:#c47a12}.smem{stroke:#0f8a80}.skeep{stroke:#6b4bd6}
  text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){
    .bg{fill:#0d1117}.fg{fill:#e6e9ef}.mu{fill:#9aa4b5}.ln{stroke:#2c3442}.st{stroke:#e6e9ef}
    .dn{fill:#3a414d}.win{fill:#e6a03c}.mem{fill:#3cc4b7}.keep{fill:#a08bff}.sink{fill:#ef6f86}.orig{fill:#6b7484}
    .twin{fill:#3a2b14}.tmem{fill:#12332f}.tkeep{fill:#2a2346}.box{fill:#161b22}
    .swin{stroke:#e6a03c}.smem{stroke:#3cc4b7}.skeep{stroke:#a08bff}
  }
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fg"/></marker></defs><rect width="880" height="215" rx="10" class="bg"/><text x="24" y="32" font-size="15" text-anchor="start" class="fg" font-weight="600">Where a token lives</text><rect x="24" y="70" width="26" height="40" class="sink"/><rect x="50" y="70" width="560" height="40" class="tmem smem" stroke-width="1.2"/><rect x="610" y="70" width="246" height="40" class="twin swin" stroke-width="1.2"/><text x="37" y="62" font-size="11.5" text-anchor="middle" class="sink">4 sinks</text><text x="330" y="95" font-size="13" text-anchor="middle" class="mem">delta memory: compressed, constant size</text><text x="733" y="95" font-size="13" text-anchor="middle" class="win">window: last 2048, exact</text><line x1="24" y1="132" x2="852" y2="132" class="st" stroke-width="1" marker-end="url(#a)"/><text x="24" y="152" font-size="11" text-anchor="start" class="mu">position 0</text><text x="610" y="152" font-size="11" text-anchor="middle" class="mu">t − 2048</text><text x="856" y="152" font-size="11" text-anchor="end" class="mu">t (now)</text><path d="M620,64 C590,40 545,40 520,66" fill="none" class="smem" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="630" y="52" font-size="11.5" text-anchor="start" class="mem">one token per step moves into memory</text><text x="24" y="182" font-size="12" text-anchor="start" class="mu">Memory v2: the 4 KV heads forget at different rates (half-lives log-spaced from 2048 to 1M tokens);</text><text x="24" y="199" font-size="12" text-anchor="start" class="mu">one archival head never forgets.</text></svg>