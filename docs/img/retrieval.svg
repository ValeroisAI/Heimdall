<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" role="img" aria-label="Retrieval attention: block summaries give an upper bound; the top blocks plus window and sinks are read"><style>
  .bg{fill:#ffffff}.fg{fill:#172033}.mu{fill:#5b6577}.ln{stroke:#d5dae3}.st{stroke:#172033}
  .dn{fill:#c9ced8}.win{fill:#c47a12}.mem{fill:#0f8a80}.keep{fill:#6b4bd6}.sink{fill:#b4384f}.orig{fill:#8a93a3}
  .twin{fill:#fbefdc}.tmem{fill:#dcf3f0}.tkeep{fill:#ebe5fb}.box{fill:#f6f7f9}
  .swin{stroke:#c47a12}.smem{stroke:#0f8a80}.skeep{stroke:#6b4bd6}
  text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){
    .bg{fill:#0d1117}.fg{fill:#e6e9ef}.mu{fill:#9aa4b5}.ln{stroke:#2c3442}.st{stroke:#e6e9ef}
    .dn{fill:#3a414d}.win{fill:#e6a03c}.mem{fill:#3cc4b7}.keep{fill:#a08bff}.sink{fill:#ef6f86}.orig{fill:#6b7484}
    .twin{fill:#3a2b14}.tmem{fill:#12332f}.tkeep{fill:#2a2346}.box{fill:#161b22}
    .swin{stroke:#e6a03c}.smem{stroke:#3cc4b7}.skeep{stroke:#a08bff}
  }
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fg"/></marker></defs><rect width="880" height="262" rx="10" class="bg"/><text x="24" y="32" font-size="15" text-anchor="start" class="fg" font-weight="600">Retrieval attention for the 4 kept layers (BIFROST_RET)</text><text x="24" y="52" font-size="12" text-anchor="start" class="mu">per 64-token block: min and max of every key dimension; read only the blocks whose upper bound is highest</text><rect x="390" y="70" width="170" height="40" rx="20" class="box st" stroke-width="1.2"/><text x="475" y="95" font-size="13" text-anchor="middle" class="fg">new query q</text><rect x="24" y="160" width="14" height="38" class="sink"/><rect x="40" y="160" width="26" height="38" class="box ln" stroke-width="1"/><rect x="68" y="160" width="26" height="38" class="box ln" stroke-width="1"/><rect x="96" y="160" width="26" height="38" class="keep" stroke-width="1"/><rect x="124" y="160" width="26" height="38" class="box ln" stroke-width="1"/><rect x="152" y="160" width="26" height="38" class="box ln" stroke-width="1"/><rect x="180" y="160" width="26" height="38" class="box ln" stroke-width="1"/><rect x="208" y="160" width="26" height="38" class="box ln" stroke-width="1"/><rect x="236" y="160" width="26" height="38" class="keep" stroke-width="1"/><rect x="264" y="160" width="26" height="38" class="keep" stroke-width="1"/><rect x="292" y="160" width="26" height="38" class="box ln" stroke-width="1"/><rect x="320" y="160" width="26" height="38" class="box ln" stroke-width="1"/><rect x="348" y="160" width="26" height="38" class="box ln" stroke-width="1"/><rect x="376" y="160" width="26" height="38" class="box ln" stroke-width="1"/><rect x="404" y="160" width="26" height="38" class="box ln" stroke-width="1"/><rect x="432" y="160" width="26" height="38" class="keep" stroke-width="1"/><rect x="460" y="160" width="26" height="38" class="box ln" stroke-width="1"/><rect x="488" y="160" width="26" height="38" class="box ln" stroke-width="1"/><rect x="516" y="160" width="26" height="38" class="box ln" stroke-width="1"/><rect x="544" y="160" width="26" height="38" class="keep" stroke-width="1"/><rect x="572" y="160" width="26" height="38" class="box ln" stroke-width="1"/><rect x="604" y="160" width="252" height="38" class="twin swin" stroke-width="1.2"/><text x="730" y="184" font-size="12.5" text-anchor="middle" class="win">window: last 2048 tokens</text><path d="M475,110 C475,135 109,130 109,156" fill="none" class="skeep" stroke-width="1.3" marker-end="url(#a)"/><path d="M475,110 C475,135 249,130 249,156" fill="none" class="skeep" stroke-width="1.3" marker-end="url(#a)"/><path d="M475,110 C475,135 277,130 277,156" fill="none" class="skeep" stroke-width="1.3" marker-end="url(#a)"/><path d="M475,110 C475,135 445,130 445,156" fill="none" class="skeep" stroke-width="1.3" marker-end="url(#a)"/><path d="M475,110 C475,135 557,130 557,156" fill="none" class="skeep" stroke-width="1.3" marker-end="url(#a)"/><path d="M520,110 C600,130 700,130 720,156" fill="none" class="swin" stroke-width="1.3" marker-end="url(#a)"/><text x="600" y="86" font-size="11.5" text-anchor="start" class="keep">top-k blocks by upper bound</text><text x="24" y="226" font-size="12" text-anchor="start" class="mu">Upper bound = Σ_d max(q_d·min_d, q_d·max_d): no key in the block can score higher, so a relevant block is not</text><text x="24" y="243" font-size="12" text-anchor="start" class="mu">skipped. Softmax over the picked tokens is exact. Reads 4 + 2048 + 64 + 16×64 ≈ 3.1K tokens at any context length.</text></svg>