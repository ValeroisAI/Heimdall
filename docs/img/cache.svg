<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 294" width="880" height="294" role="img" aria-label="Cache at 128K: original 8 GB; Bifrost 12/4 2 GB KV plus 0.5 GB state; with q4_0 KV 0.56 plus 0.5 GB"><style>
