</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fg"/></marker></defs><rect width="880" height="294" rx="10" class="bg"/><text x="24" y="32" font-size="15" text-anchor="start" class="fg" font-weight="600">Cache at 128K tokens, Qwen3.8-27B</text><text x="24" y="52" font-size="12" text-anchor="start" class="mu">by calculation: 4 KB per token per full-attention layer (f16); DeltaNet state is the same in all rows</text><text x="24" y="98" font-size="12.5" text-anchor="start" class="fg">Original, 16 full-attention layers</text><rect x="300" y="80" width="500.0" height="26" class="keep"/><text x="808.0" y="98" font-size="12.5" text-anchor="start" class="fg mono">8 GB</text><text x="24" y="150" font-size="12.5" text-anchor="start" class="fg">Bifrost 12/4, KV f16</text><rect x="300" y="132" width="125.0" height="26" class="keep"/><rect x="425.0" y="132" width="31.9" height="26" class="mem"/><text x="464.875" y="150" font-size="12.5" text-anchor="start" class="fg mono">2 + 0.51 GB</text><text x="24" y="202" font-size="12.5" text-anchor="start" class="fg">Bifrost 12/4, KV q4_0</text><rect x="300" y="184" width="35.0" height="26" class="keep"/><rect x="335.0" y="184" width="31.9" height="26" class="mem"/><text x="374.875" y="202" font-size="12.5" text-anchor="start" class="fg mono">0.56 + 0.51 GB</text><line x1="300" y1="236" x2="800" y2="236" class="ln" stroke-width="1"/><text x="300.0" y="252" font-size="11" text-anchor="middle" class="mu mono">0</text><text x="425.0" y="252" font-size="11" text-anchor="middle" class="mu mono">2</text><text x="550.0" y="252" font-size="11" text-anchor="middle" class="mu mono">4</text><text x="675.0" y="252" font-size="11" text-anchor="middle" class="mu mono">6</text><text x="800.0" y="252" font-size="11" text-anchor="middle" class="mu mono">8</text><rect x="24" y="266" width="14" height="14" rx="3" class="keep"/><text x="46" y="