<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-label="Bifrost layer: window attention and delta memory share q, k, v; tokens enter memory when they leave the window; gamma mixes the two"><style>
  .bg{fill:#ffffff}.fg{fill:#172033}.mu{fill:#5b6577}.ln{stroke:#d5dae3}.st{stroke:#172033}
  .dn{fill:#c9ced8}.win{fill:#c47a12}.mem{fill:#0f8a80}.keep{fill:#6b4bd6}.sink{fill:#b4384f}.orig{fill:#8a93a3}
  .twin{fill:#fbefdc}.tmem{fill:#dcf3f0}.tkeep{fill:#ebe5fb}.box{fill:#f6f7f9}
  .swin{stroke:#c47a12}.smem{stroke:#0f8a80}.skeep{stroke:#6b4bd6}
  text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){
    .bg{fill:#0d1117}.fg{fill:#e6e9ef}.mu{fill:#9aa4b5}.ln{stroke:#2c3442}.st{stroke:#e6e9ef}
    .dn{fill:#3a414d}.win{fill:#e6a03c}.mem{fill:#3cc4b7}.keep{fill:#a08bff}.sink{fill:#ef6f86}.orig{fill:#6b7484}
    .twin{fill:#3a2b14}.tmem{fill:#12332f}.tkeep{fill:#2a2346}.box{fill:#161b22}
    .swin{stroke:#e6a03c}.smem{stroke:#3cc4b7}.skeep{stroke:#a08bff}
  }
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fg"/></marker></defs><rect width="880" height="390" rx="10" class="bg"/><text x="24" y="32" font-size="15" text-anchor="start" class="fg" font-weight="600">Inside a Bifrost layer</text><text x="24" y="52" font-size="12.5" text-anchor="start" class="mu">the teacher's own q, k, v; only ~8 small tensors are new</text><rect x="24" y="160" width="100" height="50" rx="8" class="box st" stroke-width="1.2"/><text x="74" y="182" font-size="13" text-anchor="middle" class="fg">x</text><text x="74" y="199" font-size="11" text-anchor="middle" class="mu">layer input</text><rect x="160" y="145" width="140" height="80" rx="8" class="box st" stroke-width="1.2"/><text x="230" y="176" font-size="13" text-anchor="middle" class="fg">q, k, v</text><text x="230" y="194" font-size="11" text-anchor="middle" class="mu">pretrained, frozen</text><path d="M124,185 L156,185" fill="none" class="st" stroke-width="1.3" marker-end="url(#a)"/><rect x="350" y="74" width="230" height="96" rx="8" class="twin swin" stroke-width="1.6"/><text x="465" y="102" font-size="14" text-anchor="middle" class="win" font-weight="600">Window attention</text><text x="465" y="124" font-size="12" text-anchor="middle" class="fg">4 sinks + last 2048 tokens</text><text x="465" y="142" font-size="12" text-anchor="middle" class="fg">exact softmax</text><text x="465" y="160" font-size="11" text-anchor="middle" class="mu mono">o_win, lse_win</text><rect x="350" y="230" width="230" height="100" rx="8" class="tmem smem" stroke-width="1.6"/><text x="465" y="258" font-size="14" text-anchor="middle" class="mem" font-weight="600">Delta-rule memory</text><text x="465" y="280" font-size="12" text-anchor="middle" class="fg">one 256×256 state per KV head</text><text x="465" y="298" font-size="12" text-anchor="middle" class="fg">read: q_m · S</text><text x="465" y="318" font-size="11" text-anchor="middle" class="mu mono">o_mem, constant size</text><path d="M300,170 C326,170 326,122 346,122" fill="none" class="st" stroke-width="1.3" marker-end="url(#a)"/><path d="M300,200 C326,200 326,280 346,280" fill="none" class="st" stroke-width="1.3" marker-end="url(#a)"/><path d="M440,170 L440,226" fill="none" class="smem" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="448" y="196" font-size="11.5" text-anchor="start" class="mem">token t − 2048 leaves the</text><text x="448" y="211" font-size="11.5" text-anchor="start" class="mem">window and is written</text><rect x="630" y="145" width="120" height="80" rx="40" class="box st" stroke-width="1.2"/><text x="690" y="181" font-size="14" text-anchor="middle" class="fg" font-weight="600">mix γ</text><text x="690" y="199" font-size="11" text-anchor="middle" class="mu">per token</text><path d="M580,122 C606,122 606,170 626,170" fill="none" class="swin" stroke-width="1.3" marker-end="url(#a)"/><path d="M580,280 C606,280 606,200 626,200" fill="none" class="smem" stroke-width="1.3" marker-end="url(#a)"/><rect x="780" y="160" width="76" height="50" rx="8" class="box st" stroke-width="1.2"/><text x="818" y="182" font-size="12.5" text-anchor="middle" class="fg">o_proj</text><text x="818" y="199" font-size="11" text-anchor="middle" class="mu">frozen</text><path d="M750,185 L776,185" fill="none" class="st" stroke-width="1.3" marker-end="url(#a)"/><text x="24" y="368" font-size="12.5" text-anchor="start" class="fg mono">o = o_win + γ·(mem_scale·o_mem − o_win),   γ = σ(W_mix·x + mix_lse·(lse_win − log W)), 0 before the window fills</text></svg>